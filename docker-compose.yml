version: "3.9"

services:
  ########################################
  # Инфраструктура
  ########################################

  postgres:
    image: postgres:16-alpine
    container_name: crypto-bot-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_bot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crypto-bot-net

  redis:
    image: redis:7-alpine
    container_name: crypto-bot-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    networks:
      - crypto-bot-net

  nats:
    image: nats:2.10-alpine
    container_name: crypto-bot-nats
    restart: always
    ports:
      - "4222:4222"
    command: ["-js"]  # включаем JetStream на будущее (по желанию)
    networks:
      - crypto-bot-net

  ########################################
  # Сервисы приложения
  ########################################

  analyser:
    build:
      context: .
      dockerfile: ./cmd/analyser/Dockerfile
    container_name: crypto-bot-analyser
    env_file:
      - .env
    environment:
      # переопределяем адрес tg-bot’а для gRPC
      # внутри docker-сети он доступен по имени сервиса "tg-bot"
      TGBOT_GRPC_ADDR: tg-bot:50051
      ANALYSER_GRPC_ADDR: ":50052"
      # (остальные переменные берутся из .env)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started

    restart: unless-stopped

    ports:
      - "8080:8080"   # ANALYSER_HTTP_PORT
      - "9090:50052"  # внешний 9090 -> внутренний gRPC-порт 50052 (под ANALYSER_GRPC_ADDR)
    networks:
      - crypto-bot-net

  tg-bot:
    build:
      context: .
      # если у тебя отдельный Dockerfile для бота:
      dockerfile: ./cmd/tg-bot/Dockerfile
    container_name: crypto-bot-tgbot
    restart: always
    env_file:
      - .env
    environment:
      TGBOT_GRPC_ADDR: ":50051"       # слушаем внутри контейнера
      ANALYSER_GRPC_ADDR: "analyser:50052"
    depends_on:
      - redis
    ports:
      - "8081:8081"   # TGBOT_HTTP_PORT (если нужен http)
      - "50051:50051" # gRPC бот-сервиса (для отладки/локального вызова)
    networks:
      - crypto-bot-net

  rapira-gw:
    build:
      context: .
      dockerfile: ./cmd/rapira-gw/Dockerfile
    container_name: crypto-bot-rapira-gw
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8082:8082"   # RAPIRA_GW_HTTP_PORT (на будущее: health/profiles)
    networks:
      - crypto-bot-net

  grinex-gw:
    build:
      context: .
      dockerfile: ./cmd/grinex-gw/Dockerfile
    container_name: crypto-bot-grinex-gw
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
      - nats
    ports:
      - "8083:8083"
    networks:
      - crypto-bot-net


  ########################################
  # Миграции БД
  ########################################

  migrations:
    image: migrate/migrate:v4.17.0
    container_name: crypto-bot-migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crypto-bot-net
    volumes:
      - ./migrations:/migrations:ro
    # важное:
    restart: on-failure
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]

      



networks:
  crypto-bot-net:
    driver: bridge

volumes:
  pgdata:
